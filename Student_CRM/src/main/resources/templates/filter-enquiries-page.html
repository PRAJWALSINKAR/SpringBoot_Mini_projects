<!-- templates/filter-enquiries-page.html -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="tableContent">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Mode</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Action</th> <!-- ✅ Needed -->
                </tr>
            </thead>
            <tbody>
                <tr th:each="enq : ${enquiries}">
                    <td th:text="${enq.studentName}">Name</td>
                    <td th:text="${enq.studentPhno}">Phone</td>
                    <td th:text="${enq.courseName}">Course</td>
                    <td th:text="${enq.classMode}">Mode</td>
                    <td th:text="${enq.enqStatus}">Status</td>
                    <td th:text="${#dates.format(enq.dateCreated, 'dd-MM-yyyy')}">Date</td>
                    <td>
                        <a th:href="@{/enquiry(enqId=${enq.enqId})}" class="btn btn-sm btn-primary">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(enquiries)}">
                    <td colspan="7" class="text-center text-muted">No enquiries found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
