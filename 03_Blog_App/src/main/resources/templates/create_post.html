<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create/Edit Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">My Blog App</a>
        <div class="d-flex">
            <a class="btn btn-outline-light me-2" href="/">View Blog</a>
            <a class="btn btn-outline-light" href="/dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4" th:text="${post.postId == null ? 'Create New Post' : 'Edit Post'}"></h2>

        <form action="/post/save" method="post" th:object="${post}">
            <input type="hidden" th:field="*{postId}" />

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Short Description</label>
                <input type="text" th:field="*{description}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea th:field="*{content}" class="form-control" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/dashboard" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
