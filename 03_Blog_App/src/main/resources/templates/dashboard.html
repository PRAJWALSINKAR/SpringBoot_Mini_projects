<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">My Blog App</a>
        <div class="d-flex ms-auto">
            <a class="btn btn-outline-light me-2" href="/">View Blog</a>
            <a class="btn btn-outline-light me-2" href="/dashboard">Dashboard</a>
            <a class="btn btn-danger" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Your Blog Posts</h2>
    <div class="d-flex justify-content-between mb-3">
        <a href="/post/new" class="btn btn-success">+ Create New Post</a>
    </div>

    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Description</th>
                <th>Created Date</th>
                <th>Posted By</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post, iStat : ${posts}">
                <td th:text="${iStat.count}"></td>
                <td th:text="${post.title}"></td>
                <td th:text="${post.description}"></td>
                <td th:text="${post.createdOn}"></td>
                <td th:text="${post.user.email}">Author Email</td>
                <td>
                    <a th:href="@{'/post/edit/' + ${post.postId}}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{'/post/delete/' + ${post.postId}}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
