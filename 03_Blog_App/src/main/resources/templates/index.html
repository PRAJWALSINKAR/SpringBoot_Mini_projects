<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>All Blogs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">My Blog App</a>
    <div class="d-flex ms-auto">
      <a class="btn btn-outline-light me-2" href="/">View Blog</a>

      <a th:if="${user != null}" class="btn btn-outline-light me-2" href="/dashboard">Dashboard</a>
      <a th:if="${user != null}" class="btn btn-danger" href="/logout">Logout</a>

      <a th:if="${user == null}" class="btn btn-outline-light me-2" href="/login">Login</a>
      <a th:if="${user == null}" class="btn btn-outline-light" href="/register">Register</a>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="mb-4">All Blog Posts</h2>
  
  <div class="row row-cols-1 row-cols-md-2 g-4" th:if="${!#lists.isEmpty(posts)}">
    <div class="col" th:each="post : ${posts}">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title" th:text="${post.title}"></h5>
          <p class="card-text" th:text="${post.description}"></p>
          <a th:href="@{'/post/view/' + ${post.postId}}" class="btn btn-primary">Read More</a>
        </div>
        <div class="card-footer text-muted">
          Posted on <span th:text="${post.createdOn}"></span>
          <span th:if="${post.user != null}">
            by <strong th:text="${post.user.fname + ' ' + post.user.lname}"></strong>
          </span>
        </div>
      </div>
    </div>
  </div>
  
  <p th:if="${#lists.isEmpty(posts)}">No blog posts found.</p>
</div>

</body>
</html>
