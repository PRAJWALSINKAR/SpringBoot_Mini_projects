<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">Blog Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">My Blog App</a>

        <div class="d-flex ms-auto">
            <a class="btn btn-outline-light me-2" href="/">View Blog</a>

            <!-- Show if user is logged in -->
            <a th:if="${user != null}" class="btn btn-outline-light me-2" href="/dashboard">Dashboard</a>
            <a th:if="${user != null}" class="btn btn-danger" href="/logout">Logout</a>

            <!-- Show if no user logged in -->
            <a th:if="${user == null}" class="btn btn-outline-light me-2" href="/login">Login</a>
            <a th:if="${user == null}" class="btn btn-outline-light" href="/register">Register</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Blog Post -->
    <div class="card mb-4">
        <div class="card-body">
            <h2 class="card-title" th:text="${post.title}"></h2>
            <h6 class="card-subtitle mb-2 text-muted" th:text="${post.description}"></h6>
            <hr>
            <p class="card-text" th:text="${post.content}"></p>
            <div class="card-footer text-muted">
                Posted on <span th:text="${post.createdOn}"></span>
                <span th:if="${post.user != null}">
                    by <strong th:text="${post.user.fname + ' ' + post.user.lname}">Author Name</strong>
                    (<span th:text="${post.user.email}">author@email.com</span>)
                </span>
                <span th:if="${post.user == null}">
                    by <strong>Unknown</strong>
                </span>
            </div>
        </div>
    </div>

    <!-- Comments Section -->
    <div class="card mb-4">
        <div class="card-header">
            <h5>Comments</h5>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="c : ${comments}">
                <strong th:text="${c.email}"></strong>
                <span class="text-muted">on <span th:text="${c.createdOn}"></span></span>
                <p th:text="${c.content}" class="mb-0"></p>
            </li>
            <li class="list-group-item" th:if="${#lists.isEmpty(comments)}">
                No comments yet. Be the first to comment!
            </li>
        </ul>
    </div>

    <!-- Add Comment Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5>Add a Comment</h5>
        </div>
        <div class="card-body">
            <form action="/post/comment" method="post" th:object="${comment}">
                <input type="hidden" name="postId" th:value="${post.postId}" />
                <div class="mb-3">
                    <label class="form-label">Your Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Enter your email" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Comment</label>
                    <textarea th:field="*{content}" class="form-control" rows="3" placeholder="Write your comment..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Post Comment</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
